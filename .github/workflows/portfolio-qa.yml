name: Portfolio QA

on:
  push:
    branches: [portfolio-rebuild, main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 01_sales_analysis/requirements.txt
          pip install -r 02_ab_testing/requirements.txt
          pip install -r 04_marketing_analysis/requirements.txt
          pip install -r 06_final_project/requirements.txt

      - name: Compile Python
        run: |
          python -m py_compile 01_sales_analysis/analysis.py
          python -m py_compile 02_ab_testing/analysis.py
          python -m py_compile 02_ab_testing/download_data.py
          python -m py_compile 04_marketing_analysis/analysis.py
          python -m py_compile 06_final_project/analysis.py

      - name: Run Sales Analysis
        run: python 01_sales_analysis/analysis.py

      - name: Download and run A/B Testing
        run: |
          python 02_ab_testing/download_data.py
          python 02_ab_testing/analysis.py

      - name: Run Marketing Analysis
        run: python 04_marketing_analysis/analysis.py

      - name: Run Final Project
        run: python 06_final_project/analysis.py
